[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradexv2"
version = "0.1.0"
description = "Python-based, broker-agnostic algorithmic trading framework for Indian exchanges"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pydantic>=2.5",
    "rich>=13.0",
    "textual>=0.40",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "dhanhq>=2.2,<2.3",
    "pyotp>=2.9",
    "PyJWT>=2.8",
    "aiohttp>=3.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
    "bandit>=1.7",
    "pip-audit>=2.6",
    "import-linter>=2.0",
    "httpx>=0.27",  # FastAPI TestClient transport
    "hypothesis>=6.100",
]

[project.scripts]
tradex = "scalpr.cli.main:main"

[project.entry-points."tradex.brokers"]
dhan = "scalpr.brokers.dhan.gateway:DhanGateway"
paper = "scalpr.oms.paper_oms:PaperOms"
simulated = "scalpr.simulation.simulated_gateway:SimulatedGateway"

[tool.setuptools.packages.find]
include = ["scalpr*", "brokers*", "cli*", "analytics*", "datalake*", "config*", "domain*", "runtime*", "market_data*", "oms*", "event_bus*", "portfolio*", "risk*", "strategy*", "backtesting*", "replay*", "scripts*"]

# ─── pytest ────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "unit: module-owned unit tests",
    "contract: broker/module contract tests",
    "dhan: DhanHQ integration tests",
    "integration: tests that call external broker APIs",
    "sandbox: sandbox tests that may place and cancel orders",
    "live_readonly: live tests that must only read from real endpoints",
    "performance: latency and throughput benchmarks",
    "upstox: Upstox-specific unit tests",
    "upstox_integration: Upstox integration tests (gated by UPSTOX_INTEGRATION=1)",
    "upstox_sandbox: sandbox tests that may place and cancel orders",
    "upstox_live_readonly: live tests that must only read from real endpoints",
    "upstox_sdk_compat: SDK compatibility tests",
    "stress: long-running concurrency stress tests",
    "pre_prod: tests required on pre-prod gate (run only when PRE_PROD_GATE=1)",
    "cli_endpoint: offline subprocess smoke for a registered CLI endpoint",
    "cli_endpoint_live: live_readonly subprocess smoke — requires .env.local Dhan creds",
    "cli_endpoint_sandbox: sandbox order placement — requires DHAN_INTEGRATION=1",
    "paper_replay_parity: Paper trading ↔ Replay engine parity",
    "cross_broker_parity: Cross-broker data source parity",
    "live_backtest_parity: Live ↔ Backtest execution parity",
    "scanner_determinism: Scanner output determinism",
    "feature_parity: Feature computation parity across runs",
    "oms_integration: OMS and broker gateway integration tests",
    "memory: Memory profiling and leak detection tests",
    "e2e: End-to-end trading flow tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --tb=short --durations=10"
filterwarnings = [
    # A test that returns a value instead of asserting is a lying test (S-5).
    "error::pytest.PytestReturnNotNoneWarning",
]

# Parity enforcement - register custom pytest plugin
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ─── coverage ─────────────────────────────────────────────
[tool.coverage.run]
source = ["scalpr"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/tests/run.py",
]

[tool.coverage.report]
# Ratchet floor: actual coverage was 69% when the CI gate was turned on
# (2026-07-28). Raise this as coverage grows; never lower it.
fail_under = 68
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true

# Mutation testing configuration (mutmut)
[tool.mutmut]
paths_to_mutate = "scalpr"
mutation_operators = [
    "uop",
    "aod",
    "aor",
    "cos",
]
test_runner = "pytest tests/ -x -q"
timeout = 300  # 5 minutes per mutation
fail_under = 90  # 90% mutant kill rate required

# ─── mypy ─────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "scripts/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = ["dhanhq.*"]
ignore_missing_imports = true

# ─── ruff ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".cache", "runtime", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "G",   # flake8-logging-format
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # function-call-in-default-argument (common in FastAPI/Django)
    "S101",  # assert (we use asserts in tests)
    "S104",  # hardcoded-bind-all-interfaces (we control the env)
    # ── Ratchet debt (S-gates 2026-07-28): stylistic backlog, burn down over time.
    # Do NOT add new rules here without a kanban debt task.
    "G004",   # logging-f-string (68 sites; migrate to lazy %-style incrementally)
    "N806",   # non-lowercase-variable-in-function (broker wire-field locals)
    "N815",   # mixed-case-variable-in-class-scope (pydantic models mirror API fields)
    "N818",   # error-suffix-on-exception-name (renaming exceptions is API churn)
    "B007",   # unused-loop-control-variable
    "SIM105", # suppressible-exception
    "SIM117", # multiple-with-statements
    "UP007",  # non-pep604-annotation-union
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B011", "B017", "RUF043", "E402"]
"scripts/**/*.py" = ["S", "E", "F"]
"scalpr/testing/**/*.py" = ["S311"]  # chaos-injection jitter, not crypto

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

# ─── Coding Standards ─────────────────────────────────────
# These rules enforce architectural invariants and team conventions.
# See docs/CODING_STANDARDS.md for the full guide.

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"scalpr.brokers.dhan.Quote" = {msg = "Import Quote from scalpr.brokers.contracts, not from broker-specific packages"}
"scalpr.brokers.dhan.Balance" = {msg = "Import Funds from scalpr.brokers.contracts"}

# ─── Import Linter Contracts ──────────────────────────────
# Enforce architectural layer boundaries (REF-012).
# Run: lint-imports --config pyproject.toml

[tool.importlinter]
root_packages = ["scalpr"]

[[tool.importlinter.contracts]]
name = "Domain independence"
type = "forbidden"
source_modules = ["scalpr.domain"]
forbidden_modules = ["scalpr.brokers", "scalpr.api", "scalpr.cli", "scalpr.oms"]

[[tool.importlinter.contracts]]
name = "Risk cannot import API"
type = "forbidden"
source_modules = ["scalpr.risk"]
forbidden_modules = ["scalpr.api", "scalpr.cli"]

[[tool.importlinter.contracts]]
name = "OMS cannot import API"
type = "forbidden"
source_modules = ["scalpr.oms"]
forbidden_modules = ["scalpr.api", "scalpr.cli"]

[[tool.importlinter.contracts]]
name = "Strategy cannot import API"
type = "forbidden"
source_modules = ["scalpr.strategy"]
forbidden_modules = ["scalpr.api", "scalpr.cli"]

[[tool.importlinter.contracts]]
name = "Broker Dhan isolation"
type = "forbidden"
source_modules = ["scalpr.brokers.dhan"]
forbidden_modules = ["scalpr.api", "scalpr.cli"]

[[tool.importlinter.contracts]]
name = "Broker abstraction cannot import Dhan implementation"
type = "forbidden"
source_modules = [
    "scalpr.brokers.broker_port",
    "scalpr.brokers.capabilities",
    "scalpr.brokers.contracts",
    "scalpr.brokers.errors",
    "scalpr.brokers.gateway",
    "scalpr.brokers.instrument_handle",
    "scalpr.brokers.rate_limit",
]
forbidden_modules = ["scalpr.brokers.dhan"]
# Registry and facade use lazy imports inside functions for broker discovery
ignore_imports = [
    "scalpr.brokers.registry -> scalpr.brokers.dhan.gateway",
    "scalpr.brokers.registry -> scalpr.brokers.dhan.auth",
    "scalpr.brokers.registry -> scalpr.brokers.dhan.option_chain",
    "scalpr.brokers.registry -> scalpr.brokers.dhan.ws_manager",
    "scalpr.brokers.gateway.facade -> scalpr.brokers.dhan._totp_cooldown",
]

[[tool.importlinter.contracts]]
name = "Risk cannot import Dhan implementation"
type = "forbidden"
source_modules = ["scalpr.risk"]
forbidden_modules = ["scalpr.brokers.dhan"]

[[tool.importlinter.contracts]]
name = "Market data cannot import Dhan implementation"
type = "forbidden"
source_modules = ["scalpr.market_data"]
forbidden_modules = ["scalpr.brokers.dhan"]
