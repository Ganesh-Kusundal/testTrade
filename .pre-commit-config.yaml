repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '.secrets.baseline'
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: lint-imports --config pyproject.toml
        language: system
        pass_filenames: false
        files: '^scalpr/.*\.py$'
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check scalpr tests
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest-unit-contract
        name: pytest unit+contract (pre-push gate)
        entry: .venv/bin/python -m pytest tests/unit tests/contract -q -x -p no:cacheprovider
        language: system
        pass_filenames: false
        stages: [pre-push]
